services:
  master:
    # image: petschenek/ubuntu-systemd:master-${ARCH}-22.04
    build:
      context: ../master-image
      dockerfile: ../master-image/Dockerfile
      args:
        TARGETARCH: amd64
    environment:
      ETCD_STATE: ${ETCD_STATE}
      CLUSTER_NAME: ${CLUSTER_NAME}
    container_name: master
    hostname: master
    privileged: true
    user: root
    stdin_open: true  # Allows the container to stay running
    tty: true         # Enables terminal emulation
    ports:
      - "80:80"
      - "443:443"
      - "6443:6443"
    expose:
      - 8443
    volumes:
      - /lib/modules:/lib/modules:ro
      - etcd-volume:/var/lib/etcd
      - shared-volume:/home
    networks:
      clinco:
        ipv4_address: 172.172.0.1
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

networks:
  clinco:
    external: true

volumes:
  etcd-volume:
    name: etcd-${CLUSTER_NAME}
    driver: local
  shared-volume:
    name: clinco-shared-volume
    driver: local
