apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nginx-helm
  namespace: ingress-nginx
spec:
  interval: 1m
  url: https://kubernetes.github.io/ingress-nginx
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-helm
  namespace: ingress-nginx
spec:
  interval: 1m
  timeout: 5m
  chart:
    spec:
      chart: ingress-nginx
      version: '4.11.3'
      sourceRef:
        kind: HelmRepository
        name: nginx-helm
      interval: 1m
  releaseName: ingress-nginx
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    force: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  values:
    controller:
      hostNetwork: true
      hostPort:
        enabled: true 
      admissionWebhooks:
        enabled: false
      nodeSelector:
        kubernetes.io/hostname: master
      service:
        externalTrafficPolicy: Local
        external:
          enabled: true
        externalIPs:
          - 172.172.0.1